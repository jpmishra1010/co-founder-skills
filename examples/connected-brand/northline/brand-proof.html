<!doctype html><html lang="en"><meta charset="utf-8"><title>Project binding specimen</title><style>*{box-sizing:border-box}body{margin:0}#stage{width:720px;height:460px;background:var(--background);color:var(--foreground);padding:44px;font-family:var(--font-body)}img{height:30px;width:auto;max-width:250px}small{display:block;margin-top:42px;font-size:12px;letter-spacing:.16em}h1{font:500 46px/1.1 var(--font-heading);margin:16px 0 14px;letter-spacing:-.035em}p{max-width:480px;line-height:1.5;font-size:15px}.swatches{display:flex;gap:10px;margin-top:30px}.swatches i{width:50px;height:34px;border-radius:4px;border:1px solid #aaa5}.swatches i:nth-child(1){background:var(--accent)}.swatches i:nth-child(2){background:var(--foreground)}.swatches i:nth-child(3){background:var(--background)}footer{font-size:11px;margin-top:24px;opacity:.65}</style><main id="stage"><img data-safe id="logo" alt=""><small data-safe>PROJECT BINDING / FICTIONAL TEST</small><h1 data-safe id="name"></h1><p data-safe>The same composition. This project's own logo, type and palette. No shared brand fallback.</p><div class="swatches" data-safe><i></i><i></i><i></i></div><footer data-safe id="identity"></footer></main><script>const BRAND=__BRAND_JSON__;document.documentElement.dataset.projectId=BRAND.project_id;for(const[k,v]of Object.entries(BRAND.tokens))document.documentElement.style.setProperty('--'+k,v);document.documentElement.style.setProperty('--font-body',BRAND.typography.body);document.documentElement.style.setProperty('--font-heading',BRAND.typography.heading);document.getElementById('logo').src=BRAND.assets.logo;document.getElementById('logo').alt=BRAND.display_name;document.getElementById('name').textContent=BRAND.display_name;document.getElementById('identity').textContent=BRAND.project_id+' · '+BRAND.brand+' · '+BRAND.surface;</script></html>
